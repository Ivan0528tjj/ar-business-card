<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>谭俊佳 - AR 名片</title>
  <style>
    :root {
      --ink: #101312;
      --paper: #f7f8f4;
      --jade: #127a5b;
      --gold: #c9ad6a;
      --mist: rgba(255,255,255,.88);
      --line: rgba(255,255,255,.2);
    }
    * { box-sizing: border-box; }
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #151817;
      color: var(--paper);
      font-family: "Hiragino Sans GB", "PingFang SC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body.camera-mode {
      height: 100%;
      overflow: hidden;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .hud {
      position: fixed;
      z-index: 30;
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    body.target-found .hud {
      opacity: 0;
      transform: translate3d(0, -10px, 0);
      pointer-events: none;
    }
    .status {
      min-width: 0;
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,.17);
      background: rgba(16,19,18,.76);
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
      backdrop-filter: blur(16px);
    }
    .status strong {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }
    .status span {
      display: block;
      margin-top: 3px;
      color: rgba(255,255,255,.68);
      font-size: 12px;
      line-height: 1.35;
    }
    .hud-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      background: rgba(16,19,18,.78);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 16px 34px rgba(0,0,0,.24);
      backdrop-filter: blur(16px);
    }
    .control.primary {
      border-color: rgba(18,122,91,.5);
      background: rgba(18,122,91,.9);
    }
    .quick-actions-ar {
      position: fixed;
      z-index: 34;
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      opacity: 0;
      transform: translate3d(0, 18px, 0);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    body.target-found .quick-actions-ar {
      opacity: 0;
      transform: translate3d(0, 18px, 0);
      pointer-events: none;
    }
    .quick-actions-ar a {
      min-height: 50px;
      display: grid;
      place-items: center;
      gap: 4px;
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      background: rgba(16,19,18,.78);
      box-shadow: 0 18px 38px rgba(0,0,0,.26);
      backdrop-filter: blur(18px);
      font-size: 12px;
      font-weight: 700;
    }
    .quick-actions-ar img {
      width: 21px;
      height: 21px;
      display: block;
    }
    .scene-preview {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 68px 16px 24px;
      background:
        url(ar-assets/bg.png) center / cover no-repeat;
      /* original gradient background replaced */
    }
    .stage {
      position: relative;
      width: min(1180px, 100%);
      aspect-ratio: 16 / 7;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1.5%, 14px);
      padding: clamp(10px, 2%, 24px);
      background:
        radial-gradient(circle at 28% 22%, rgba(255,255,255,.3), transparent 20%),
        linear-gradient(18deg, rgba(255,255,255,.08), rgba(0,0,0,.06));
      box-shadow: 0 34px 90px rgba(0,0,0,.38);
    }
    .stage-body {
      display: flex;
      flex: 1 1 auto;
      gap: clamp(2px, 0.8%, 8px);
      min-height: 0;
    }
    .stage-left {
      flex: 0 0 50%;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.8%, 8px);
    }
    .stage-left > * {
      flex: 1 1 0;
      min-height: 0;
    }
    .stage-right {
      flex: 0 0 50%;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.8%, 8px);
    }
    .stage-right > * {
      flex: 1 1 0;
      min-height: 0;
    }
    .stage-bottom {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      gap: clamp(28px, 8%, 64px);
      align-items: center;
      margin-top: 12px;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(101deg, transparent 0 118px, rgba(255,255,255,.07) 119px 121px, transparent 122px 240px),
        radial-gradient(circle at 18% 72%, rgba(0,0,0,.22), transparent 22%);
      opacity: .35;
    }
    .visual {
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 22px 34px rgba(0,0,0,.34));
      opacity: 0;
      animation-fill-mode: both;
      z-index: 2;
      width: 100%;
      height: 100%;
    }
    .visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .card-back {
      opacity: 1;
      object-position: bottom;
      animation: card-in 760ms 200ms cubic-bezier(.16,1,.3,1) both;
    }
    .held-card {
      opacity: 1;
      object-position: bottom;
      animation: card-in 760ms cubic-bezier(.16,1,.3,1) both;
    }
    .gallery {
      width: 100%;
      max-width: min(780px, 100%);
      height: auto;
      max-height: 50vh;
      object-fit: contain;
      display: block;
      margin: 12px auto 0;
      border-radius: 8px;
      animation: pop-left 620ms 460ms cubic-bezier(.2,1.12,.3,1) both;
    }
    .identity {
      width: 100%;
      height: 100%;
      align-self: center;
      flex: 1 1 0;
      object-fit: contain;
      animation: pop-center 700ms 650ms cubic-bezier(.2,1.18,.3,1) both;
    }
    .pill {
      width: 42%;
      align-self: center;
      animation: pop-center 540ms cubic-bezier(.2,1.12,.3,1) both;
    }
    .pill img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .pill-row {
      display: flex;
      flex: 0 0 auto;
      min-height: 0;
      gap: 6px;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0;
    }
    .pill-row .pill {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
      max-width: 120px;
    }
    .pill.website {
      animation-delay: 930ms;
    }
    .pill.contact {
      animation-delay: 1050ms;
    }
    .icon-link {
      width: auto;
      max-width: 90px;
      aspect-ratio: 1;
      z-index: 5;
      opacity: 0;
      filter: drop-shadow(0 16px 24px rgba(0,0,0,.34));
      animation: icon-in 460ms cubic-bezier(.2,1.18,.3,1) both;
    }
    .icon-link img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stage-icons {
      display: flex;
      justify-content: center;
      gap: clamp(12px, 4%, 40px);
      align-items: center;
    }
    .icon-call { animation-delay: 1160ms; }
    .icon-mail { animation-delay: 1240ms; }
    .icon-map { animation-delay: 1320ms; }
    .icon-save { animation-delay: 1400ms; }
    .hint {
      align-self: flex-end;
      text-align: right;
      z-index: 4;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      letter-spacing: 0;
    }
    #ar-mount,
    #ar-mount a-scene {
      width: 100vw;
      height: 100vh;
    }
    #ar-mount {
      display: none;
    }
    body.camera-mode #ar-mount {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    body.camera-mode #ar-mount video {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      object-fit: cover !important;
      background: transparent !important;
    }
    body.camera-mode #ar-mount canvas,
    body.camera-mode #ar-mount .a-canvas {
      background: transparent !important;
    }
    body.camera-mode .scene-preview {
      display: none;
    }
    body.camera-mode #ar-mount {
      display: block;
    }
    body.target-found .status {
      border-color: rgba(18,122,91,.7);
    }
    .tap-flash {
      position: fixed;
      z-index: 36;
      width: 74px;
      height: 74px;
      margin: -37px 0 0 -37px;
      border: 2px solid rgba(201,173,106,.86);
      background: rgba(18,122,91,.16);
      border-radius: 50%;
      pointer-events: none;
      transform: scale(.58);
      opacity: 0;
    }
    .tap-flash.show {
      animation: tap-pulse 420ms cubic-bezier(.16,1,.3,1);
    }
    .social-toast {
      position: fixed;
      z-index: 38;
      left: 50%;
      bottom: max(26px, calc(env(safe-area-inset-bottom) + 20px));
      width: min(340px, calc(100vw - 32px));
      padding: 14px 16px;
      color: #fff;
      background: rgba(16,19,18,.9);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 22px 48px rgba(0,0,0,.34);
      backdrop-filter: blur(18px);
      transform: translate3d(-50%, 18px, 0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .social-toast.show {
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
    }
    .social-toast strong {
      display: block;
      font-size: 15px;
      line-height: 1.25;
    }
    .social-toast span {
      display: block;
      margin-top: 5px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      line-height: 1.45;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translate3d(-24px, -12px, 0) scale(.92); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes pop-left {
      from { opacity: 0; transform: translate3d(-26px, 18px, 0) scale(.74); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes pop-center {
      from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.72); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes web-in {
      from { opacity: 0; transform: translate3d(70px, 8px, 0) rotateY(-16deg) scale(.78); }
      to { opacity: 1; transform: translate3d(0, 0, 0) rotateY(-6deg) scale(1); }
    }
    @keyframes icon-in {
      from { opacity: 0; transform: translate3d(0, 38px, 0) scale(.48); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes strip-in {
      from { opacity: 0; transform: translate3d(0, 24px, 0) scale(.88); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes tap-pulse {
      0% { opacity: 0; transform: scale(.46); }
      35% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.42); }
    }
    @media (max-width: 780px) {
      .hud {
        align-items: flex-start;
      }
      .hud-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .control {
        min-width: 72px;
        min-height: 38px;
        padding: 0 10px;
      }
      .scene-preview {
        padding: 64px 0 0;
        place-items: start center;
      }
      .stage {
        width: 100vw;
        aspect-ratio: 16 / 9;
        min-height: auto;
        border-left: 0;
        border-right: 0;
        padding: 8px;
        gap: 6px;
      }
      .stage-body {
        gap: 6px;
      }
      .stage-left {
        flex: 0 0 50%;
        gap: 4px;
      }
      .stage-right {
        gap: 4px;
      }
      .held-card {
        width: 100%;
      }
      .card-back {
        width: 100%;
      }
      .gallery {
        width: 100%;
      }
      .identity {
        width: 90%;
      }
      .pill {
        width: 85%;
      }
      .pill.website {
      }
      .pill.contact {
      }
      .stage-bottom {
        gap: clamp(8px, 3%, 24px);
      }
      .icon-link {
        max-width: 44px;
      }
      .icon-call { }
      .icon-mail { }
      .icon-map { }
      .icon-save { }
      .hint {
        display: none;
      }
    }
  </style>
</head>

  </template>

  <script>
    const statusBox = document.getElementById("tracking-status");
    const startButton = document.getElementById("start-camera");
    const tapFlash = document.getElementById("tap-flash");
    const socialToast = document.getElementById("social-toast");
    const WECHAT_ID = "cyclone_2006";
    const QQ_ID = "304514421";
    let started = false;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    function setStatus(title, message, found) {
      document.body.classList.toggle("target-found", Boolean(found));
      statusBox.innerHTML = `<strong>${title}</strong><span>${message}</span>`;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error("Failed to load " + src));
        document.head.appendChild(script);
      });
    }

    function flashTap(x, y) {
      if (!tapFlash || typeof x !== "number" || typeof y !== "number") return;
      tapFlash.style.left = `${x}px`;
      tapFlash.style.top = `${y}px`;
      tapFlash.classList.remove("show");
      void tapFlash.offsetWidth;
      tapFlash.classList.add("show");
    }

    function showSocialToast(title, message) {
      if (!socialToast) return;
      socialToast.innerHTML = `<strong>${title}</strong><span>${message}</span>`;
      socialToast.classList.add("show");
      clearTimeout(showSocialToast.timer);
      showSocialToast.timer = setTimeout(() => socialToast.classList.remove("show"), 4200);
    }

    async function copyText(text) {
      if (!text) return false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {
      }

      try {
        const input = document.createElement("textarea");
        input.value = text;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.left = "-9999px";
        document.body.appendChild(input);
        input.select();
        const copied = document.execCommand("copy");
        input.remove();
        return copied;
      } catch (_) {
        return false;
      }
    }

    function socialActionForHref(href) {
      if (href.startsWith("weixin://")) {
        return {
          appName: "微信",
          idName: "微信号",
          idValue: WECHAT_ID,
          status: "正在打开微信",
          hint: "微信号已复制，如果没有自动跳转，请打开微信搜索添加"
        };
      }
      if (href.startsWith("mqqwpa://") || href.startsWith("tencent://")) {
        return {
          appName: "QQ",
          idName: "QQ号",
          idValue: QQ_ID,
          status: "正在打开 QQ",
          hint: "QQ号已复制，如果没有自动跳转，请打开 QQ 搜索添加"
        };
      }
      return null;
    }

    function promoVideos() {
      return Array.from(document.querySelectorAll(".gallery-video, #promoVideo"));
    }

    function playPromoVideos() {
      promoVideos().forEach((video) => {
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {});
        }
      });
    }

    function pauseARPromoVideo() {
      const video = document.getElementById("promoVideo");
      if (video) video.pause();
    }

    function openAction(href, x, y) {
      if (!href) return;
      flashTap(x, y);
      if (navigator.vibrate) navigator.vibrate(18);
      const social = socialActionForHref(href);
      if (social) {
        copyText(social.idValue).then((copied) => {
          const copyMessage = copied ? `${social.idName}已复制：${social.idValue}` : `${social.idName}：${social.idValue}`;
          showSocialToast(social.status, `${copyMessage}。${social.hint}`);
        });
        setStatus(social.status, `${social.idName} ${social.idValue}`, true);
      } else {
        setStatus("正在打开", "如果没有跳转，请再点一次按钮", true);
      }
      setTimeout(() => {
        window.location.href = href;
      }, 90);
    }

    async function startAR() {
      if (started) return;
      started = true;
      startButton.textContent = "加载中";
      setStatus("正在启动识别", "请允许浏览器使用相机", false);

      if (!navigator.mediaDevices && location.protocol === "http:") {
        started = false;
        startButton.textContent = "启动识别";
        setStatus("当前先显示预览", "这个 HTTP 浏览器可能限制相机权限", false);
        return;
      }

      try {
        await loadScript("vendor/aframe.min.js");
        await loadScript("vendor/mindar-image-aframe.prod.js");

        const arFragment = document.getElementById("ar-template").content.cloneNode(true);
        const frontTarget = arFragment.querySelector(".card-target");
        if (frontTarget) {
          const backTarget = frontTarget.cloneNode(true);
          backTarget.setAttribute("data-target-side", "背面");
          backTarget.setAttribute("mindar-image-target", "targetIndex: 1");
          frontTarget.after(backTarget);
        }
        document.getElementById("ar-mount").appendChild(arFragment);
        document.body.classList.add("camera-mode");
        playPromoVideos();

        const scene = document.getElementById("ar-scene");
        const targets = Array.from(document.querySelectorAll(".card-target"));
        const roots = Array.from(document.querySelectorAll(".ar-root"));
        const tapRaycaster = new AFRAME.THREE.Raycaster();
        const tapPoint = new AFRAME.THREE.Vector2();
        let lastTapTime = 0;
        let clickableEls = [];

        function anyRootVisible() {
          return roots.some((root) => root.object3D.visible);
        }

        function isEffectivelyVisible(object3D) {
          let current = object3D;
          while (current) {
            if (current.visible === false) return false;
            current = current.parent;
          }
          return true;
        }

        function refreshClickTargets() {
          clickableEls = Array.from(document.querySelectorAll("[data-href]"));
          clickableEls.forEach((el) => {
            const href = el.getAttribute("data-href");
            el.object3D.userData.href = href;
            el.object3D.traverse((obj) => {
              obj.userData.href = href;
              obj.userData.clickEl = el;
            });
          });
        }

        function hrefFromObject(obj) {
          let current = obj;
          while (current) {
            if (current.userData && current.userData.href) return current.userData.href;
            current = current.parent;
          }
          return "";
        }

        function handleSceneTap(event) {
          const now = Date.now();
          if (now - lastTapTime < 260) return;

          const point = event.changedTouches ? event.changedTouches[0] : event;
          if (!point || !anyRootVisible() || !scene.camera) return;

          const canvas = scene.canvas || scene.querySelector("canvas");
          if (!canvas) return;

          const rect = canvas.getBoundingClientRect();
          tapPoint.x = ((point.clientX - rect.left) / rect.width) * 2 - 1;
          tapPoint.y = -((point.clientY - rect.top) / rect.height) * 2 + 1;
          tapRaycaster.setFromCamera(tapPoint, scene.camera);

          const meshes = [];
          clickableEls.forEach((el) => {
            el.object3D.traverse((obj) => {
              if (obj.isMesh && isEffectivelyVisible(obj)) meshes.push(obj);
            });
          });

          const hits = tapRaycaster.intersectObjects(meshes, true);
          if (!hits.length) return;

          const href = hrefFromObject(hits[0].object);
          if (!href) return;

          lastTapTime = now;
          event.preventDefault();
          event.stopPropagation();
          openAction(href, point.clientX, point.clientY);
        }

        function bindSceneTap() {
          refreshClickTargets();
          const canvas = scene.canvas || scene.querySelector("canvas");
          if (!canvas || canvas.dataset.tapBound === "1") return;
          canvas.dataset.tapBound = "1";
          canvas.style.touchAction = "manipulation";
          canvas.addEventListener("pointerup", handleSceneTap, { passive: false });
          canvas.addEventListener("touchend", handleSceneTap, { passive: false });
          canvas.addEventListener("click", handleSceneTap, { passive: false });
        }

        function showPopups(event) {
          const targetEl = event.currentTarget;
          const root = targetEl.querySelector(".ar-root");
          const pops = Array.from(targetEl.querySelectorAll("[data-pop]"));
          const side = targetEl.getAttribute("data-target-side") || "名片";
          playPromoVideos();
          root.setAttribute("visible", true);
          requestAnimationFrame(() => pops.forEach((el) => el.emit("arshow")));
          setTimeout(() => pops.forEach((el) => el.emit("arfloat")), 1550);
          setStatus(`已识别${side}`, "可以点击微信、QQ、电话、邮件或地址", true);
        }

        function hidePopups(event) {
          const targetEl = event.currentTarget;
          const root = targetEl.querySelector(".ar-root");
          const pops = Array.from(targetEl.querySelectorAll("[data-pop]"));
          pops.forEach((el) => el.emit("arhide"));
          setTimeout(() => root.setAttribute("visible", false), 220);
          setTimeout(() => {
            if (!anyRootVisible()) pauseARPromoVideo();
          }, 260);
          setStatus("对准名片正面或背面", "识别后会自动弹出联系方式", false);
        }

        targets.forEach((target) => {
          target.addEventListener("targetFound", showPopups);
          target.addEventListener("targetLost", hidePopups);
        });

        scene.addEventListener("loaded", bindSceneTap);
        scene.addEventListener("renderstart", () => setTimeout(bindSceneTap, 0), { once: true });
        setTimeout(bindSceneTap, 800);

        document.querySelectorAll("[data-href]").forEach((el) => {
          el.addEventListener("click", () => {
            const href = el.getAttribute("data-href");
            if (href) openAction(href);
          });
        });

        startButton.textContent = "重启";
        startButton.onclick = () => window.location.reload();
        setStatus("对准名片正面或背面", "识别后会自动弹出联系方式", false);
      } catch (error) {
        console.error(error);
        started = false;
        startButton.textContent = "启动识别";
        document.body.classList.remove("camera-mode");
        setStatus("当前先显示预览", "相机识别未启动，按钮仍可点击", false);
      }
    }

    document.querySelectorAll('a[href^="weixin://"], a[href^="mqqwpa://"], a[href^="tencent://"]').forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        openAction(link.getAttribute("href"), event.clientX, event.clientY);
      });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        pauseARPromoVideo();
      } else {
        playPromoVideos();
      }
    });

    startButton.addEventListener("click", () => {
      playPromoVideos();
      startAR();
    });
    if (new URLSearchParams(location.search).get("camera") === "1") {
      if (isIOS) {
        setStatus("点击启动识别", "iPhone 需要手动触发相机画面", false);
      } else {
        startAR();
      }
    }
  </script>
